services:
  server:
    build:
      context: ./server
      target: production
    restart: unless-stopped
    ports:
      - "5001:5001"
    depends_on:
      minio:
        condition: service_healthy
      mysql:
        condition: service_healthy
      go-backend:
        condition: service_started
    environment:
      - FLASK_ENV=docker
      - MYSQL_HOST=mysql
      - MYSQL_PASSWORD=root_pass
      - MYSQL_ROOT_USER=root
      - MYSQL_DB=mea_db
      - MINIO_HOST=minio:9000
      - MINIO_ACCESS_KEY=minio_admin
      - MINIO_SECRET_KEY=minio_pass
    networks:
      - frontend
      - backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  client:
    build:
      context: ./client
      target: production
    restart: unless-stopped
    ports:
      - "4173:4173"
    depends_on:
      server:
        condition: service_healthy
    networks:
      - frontend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4173/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  mysql:
    restart: unless-stopped
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_pass
      MYSQL_DATABASE: mea_db
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - backend
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_pass"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  go-backend:
    restart: on-failure
    build:
      context: ./
      dockerfile: ./go-backend/dockerfile
      target: production
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_DATABASE=mea_db
      - MYSQL_ROOT_PASSWORD=root_pass
      - MINIO_HOST=minio
      - MINIO_ROOT_USER=minio_admin
      - MINIO_ROOT_PASSWORD=minio_pass
    networks:
      - frontend
      - backend

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    restart: always
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    environment:
      - MINIO_ROOT_USER=minio_admin
      - MINIO_ROOT_PASSWORD=minio_pass
    command: server /data --console-address ":9001" --compat
    networks:
      - frontend
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio-setup:
    image: minio/mc
    container_name: minio-setup
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - backend
    entrypoint: >
      /bin/sh -c "
        /usr/bin/mc alias set myminio http://minio:9000 minio_admin minio_pass;
        /usr/bin/mc mb myminio/plot-figure || true;
        /usr/bin/mc anonymous set download myminio/plot-figure;
        exit 0;
      "

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true

volumes:
  mysql_data:
  minio_data:
